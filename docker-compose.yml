version: '3.8'

services:
  # Backend Service (FastAPI + Python)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aevs-backend
    restart: unless-stopped
    networks:
      - aevs-network
    volumes:
      - tmp-data:/tmp/uploads
    environment:
      - PYTHONUNBUFFERED=1
      - MAX_FILE_SIZE=524288000 # 500MB
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend Service (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aevs-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - aevs-network
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy

networks:
  aevs-network:
    driver: bridge

volumes:
  tmp-data:
